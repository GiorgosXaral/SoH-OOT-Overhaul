# Builds SoH-OOT-Overhaul (Ship of Harkinian 9.2.3 with the Boss, Master Sword Beam,
# Epona and Miniboss & Enemy overhauls built in) for Windows, straight from this repository.
#
# Runs on every push to main and from the Actions tab ("Run workflow"). The finished build is
# the "soh-oot-overhaul" artifact: soh.exe and the DLLs next to it. No new assets are added,
# so the soh.o2r / oot.o2r from a 9.2.3 install keep working.
name: build-soh-oot-overhaul
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Keep LF line endings
      run: git config --global core.autocrlf false
    - name: Checkout this repo
      uses: actions/checkout@v6
      with:
        submodules: true
        path: shipwright
    - name: Install ninja
      run: |
        choco install ninja -y
        Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
    - name: Configure Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
    # Get vcpkg ready before CMake does:
    # - Pinned to a fixed vcpkg version (2026-06-18) so every build uses the same library
    #   versions. Newer vcpkg recipes for fmt and spdlog download patches from GitHub
    #   commit pages ("/commit/<sha>.patch"), which GitHub answers with HTTP 504 for
    #   Actions machines, breaking every build. This version has none of those.
    #   CMake's "auto-update" of vcpkg does nothing on a pinned (detached) checkout.
    # - A failed vcpkg.exe download is retried, and if it keeps failing, the vcpkg.exe
    #   that comes preinstalled on GitHub's Windows machines is used instead.
    - name: Prepare vcpkg
      working-directory: shipwright
      shell: pwsh
      env:
        VCPKG_COMMIT: 17216e045521bdb88362d4971e20cd0a487ca3ef
      run: |
        foreach ($try in 1..3) {
          if (Test-Path vcpkg/README.md) { break }
          Remove-Item -Recurse -Force vcpkg -ErrorAction SilentlyContinue
          git init -q vcpkg
          git -C vcpkg fetch --depth 1 https://github.com/Microsoft/vcpkg.git $env:VCPKG_COMMIT
          git -C vcpkg checkout -q FETCH_HEAD
          if (-not (Test-Path vcpkg/README.md)) { Start-Sleep -Seconds 20 }
        }
        if (-not (Test-Path vcpkg/README.md)) { Write-Error "Could not clone vcpkg"; exit 1 }
        foreach ($try in 1..3) {
          if (Test-Path vcpkg/vcpkg.exe) { break }
          Write-Host "=== vcpkg bootstrap attempt $try of 3 ==="
          & vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if (-not (Test-Path vcpkg/vcpkg.exe)) { Start-Sleep -Seconds 20 }
        }
        if (-not (Test-Path vcpkg/vcpkg.exe)) {
          Write-Host "Download kept failing; using the runner's preinstalled vcpkg.exe"
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" vcpkg/vcpkg.exe
        }
        & vcpkg/vcpkg.exe version
        exit 0
    # Keep downloaded files and compiled libraries between builds. Restored here and saved
    # at the end of EVERY run (even a failed one), so each retry continues where the last
    # one stopped instead of downloading and compiling everything again.
    - name: Restore library cache
      id: libcache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/AppData/Local/vcpkg/archives
          shipwright/vcpkg/downloads
        key: vcpkg-${{ runner.os }}-17216e04-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vcpkg-${{ runner.os }}-17216e04-
    # glew is the only library vcpkg gets from GitHub "release downloads", which GitHub
    # keeps answering with HTTP 503/504 for Actions machines. Fetch it ahead of time with
    # long retries, falling back to GLEW's SourceForge mirror, and check its SHA512 against
    # vcpkg's recipe. vcpkg then finds the file already downloaded and skips its own try.
    - name: Prefetch glew
      working-directory: shipwright
      shell: pwsh
      run: |
        $file = 'vcpkg/downloads/glew-2.3.1.tgz'
        $sha512 = 'cb4caecf32ec0f180c2691dc7769ffc99571c64f259a2663a2b80e788f1c2fd5362c59e0caaeefed6fb78a4070366d244666a657358049b09071b59fae2377e0'
        $urls = @(
          'https://github.com/nigels-com/glew/releases/download/glew-2.3.1/glew-2.3.1.tgz',
          'https://downloads.sourceforge.net/project/glew/glew/2.3.1/glew-2.3.1.tgz'
        )
        New-Item -ItemType Directory -Force -Path vcpkg/downloads | Out-Null
        function Test-Glew { (Test-Path $file) -and ((Get-FileHash $file -Algorithm SHA512).Hash.ToLower() -eq $sha512) }
        if (Test-Glew) { Write-Host 'glew already downloaded (from cache)'; exit 0 }
        foreach ($round in 1..4) {
          foreach ($url in $urls) {
            Write-Host "=== Round $round of 4: $url ==="
            curl.exe -fL --retry 3 --retry-all-errors --retry-delay 10 --connect-timeout 30 -o $file $url
            if (Test-Glew) { Write-Host 'glew downloaded and verified'; exit 0 }
            Remove-Item $file -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 45
        }
        Write-Host '::warning::Could not prefetch glew; vcpkg will try once more on its own'
        exit 0
    - name: Build soh.exe
      working-directory: shipwright
      env:
        VCPKG_ROOT: ${{ github.workspace }}/shipwright/vcpkg
      shell: pwsh
      # Setup downloads ~20 libraries; a single server hiccup (e.g. HTTP 504) fails it.
      # Retry up to 3 times, starting the build folder fresh each time.
      run: |
        $ok = $false
        foreach ($try in 1..3) {
          Write-Host "=== Configure attempt $try of 3 ==="
          cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release
          if ($LASTEXITCODE -eq 0) { $ok = $true; break }
          Remove-Item -Recurse -Force build-windows -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 60
        }
        if (-not $ok) { Write-Error "Configure failed 3 times"; exit 1 }
        cmake --build build-windows --config Release --parallel 4
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    # This project's CMake puts the Windows exe in <source>/Release, not in the build folder.
    # Search for it instead of assuming a path, and never fail: the listing is uploaded either way
    # so a miss can be diagnosed from the downloaded artifact alone.
    - name: Save library cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          ~/AppData/Local/vcpkg/archives
          shipwright/vcpkg/downloads
        key: ${{ steps.libcache.outputs.cache-primary-key }}
    - name: Collect soh.exe
      if: always()
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        New-Item -ItemType Directory -Force -Path out | Out-Null
 
        $exe = $null
        if (Test-Path 'shipwright/Release/soh.exe') {
          $exe = Get-Item 'shipwright/Release/soh.exe'
        } else {
          $exe = Get-ChildItem -Path shipwright -Recurse -Filter soh.exe -File -Force -ErrorAction SilentlyContinue |
                 Sort-Object Length -Descending | Select-Object -First 1
        }
 
        $lines = @()
        if ($exe) {
          $lines += "FOUND soh.exe: $($exe.FullName)  ($($exe.Length) bytes)"
          Copy-Item $exe.FullName out/soh.exe -Force
          $dir = Split-Path $exe.FullName -Parent
          $lines += "--- files next to it ---"
          Get-ChildItem -Path $dir -File -ErrorAction SilentlyContinue | ForEach-Object {
            $lines += "  $($_.Name)  $($_.Length)"
            if ($_.Extension -eq '.dll') { Copy-Item $_.FullName out/ -Force }
          }
        } else {
          $lines += "NO soh.exe ANYWHERE"
        }
 
        $lines += "--- every .exe built (vcpkg excluded) ---"
        Get-ChildItem -Path shipwright -Recurse -Filter *.exe -File -Force -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -notmatch '[\\/]vcpkg[\\/]' } |
          ForEach-Object { $lines += "  $($_.FullName)  $($_.Length)" }
 
        $lines | Out-File -FilePath out/listing.txt -Encoding utf8
        $lines | Write-Host
        exit 0
    - name: Upload soh.exe
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: soh-oot-overhaul
        path: out
        if-no-files-found: warn
 
